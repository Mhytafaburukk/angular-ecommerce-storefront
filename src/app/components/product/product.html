<table class="table">
    <thead>
        <tr>
            <th>Id</th>
            <th>Urun Adi</th>
            <th>Kategori</th>
            <th>Fiyat</th>
            <th>Stok Adedi</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let product of products">
            <td>{{product.id}}</td>
            <td>{{product.name}}</td>
            <td>{{product.price}}</td>
            <td>{{product.categoryId}}</td>
            <td>{{product.unitsInStock}}</td>
        </tr>
</table>
