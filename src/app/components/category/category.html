<ul class="list-group">
    <li (click)="setCurrentCategory(category)" [routerLink]="['/products/category', category.id]"
        *ngFor="let category of categories" [class]="getCurrentCategoryClass(category)">
        {{category.name}}</li>
</ul>

<h5 *ngIf="currentCategory">Seçili Kategori: {{currentCategory.name}}</h5>
